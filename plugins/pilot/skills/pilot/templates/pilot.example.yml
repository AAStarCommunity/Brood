# .pilot.yml — 放仓库根目录。pilot 各阶段读它取分支/清理策略。
# 脚本不解析 YAML；由 skill 用 Read 读取后作为 flag 传给脚本，保持确定简单。

base_branch: main            # 主干，受保护，禁止直推/直合
integration_branch: preview  # PR 合并进这里；若该分支不存在则回退到 base_branch
protect_patterns:            # 额外保护的分支前缀（如 release/1.2 会被 release 护住）
  - release
  - hotfix
remote: origin
allow_remote_cleanup: false  # 删除远程已合并分支需显式置 true（无人值守默认不删远程）
docs_dir: docs/agent         # 规划/运行态文档目录

# 规划已经在别处（backlog.md / issue tracker / 任何工具）时，在这里声明它的本地产物路径，
# 起跑门禁就检查这些路径，而不是 docs_dir 下那七个固定文件名。不声明 = 老行为（查七件套）。
#
# 判据不变，只是换了查哪里：每条路径都要真有内容（目录 = 底下至少一个够实质的文件），
# 空目录 / 只有占位符的文件照样判 NOT ready。声明 `.` / 绝对路径 / 通配符会被直接拒绝
# —— 那是把门禁关掉，不是配置它。
#
# planning_requires:
#   - backlog/tasks
#   - backlog/docs
#   - docs/agent/progress.md   # 运行态文档仍归 docs_dir，按需一并列进来

# PR 的裁决由外部评审服务给出，pilot 只负责盯状态（契约见 reference/review-contract.md）
