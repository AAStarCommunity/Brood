# PGL Manifest v0.2 完整示例
# 假想项目：Awesome PDF Scanner —— Wrapper 团队 X 基于 Alice 的 OCR 模型包装的产品
# 演示三角色弹性区间模型：Supplier 65% / Wrapper 25% / Seller 10%（Wrapper 工作中等）

pgl_version: "0.2"

# ===== 作品基本信息 =====
work:
  name: "Awesome PDF Scanner"
  slug: "awesome-pdf-scanner"
  type: "agent"
  category: ["productivity", "ocr", "document"]
  description_zh: "把扫描件 PDF 一键转 Markdown，本地运行，零订阅"
  description_en: "Convert scanned PDFs to Markdown locally, no subscription"
  base_license: "Apache-2.0"
  homepage: "https://github.com/team-x/awesome-pdf-scanner"
  derived_from:                              # Wrapper 主导，声明 Supplier 原作
    work_slug: "marker-pdf-core"
    supplier_homepage: "https://github.com/alice/marker-pdf"

# ===== 数字公共物品公约签署（双签）=====
charter:
  signed: true
  version: "0.1"
  signed_at: "2026-05-15T10:00:00Z"
  signatures:
    - role: "supplier"
      name: "Alice Wang"
      airaccount: "0xa11ceA11ceA11ceA11ceA11ceA11ceA11ceA11c"
      ens: "alice.pgl.eth"
      signed_at: "2026-05-14T08:00:00Z"
      signature: "0x4f3e2d1c0b9a8d7e6f5c4b3a2918e7d6c5b4a39281706f5e4d3c2b1a09f8e7d6"
    - role: "wrapper"
      name: "Team X"
      airaccount: "0xTeamXTeamXTeamXTeamXTeamXTeamXTeamX0001"
      ens: "team-x.pgl.eth"
      signed_at: "2026-05-15T10:00:00Z"
      signature: "0x9e8d7c6b5a4938271605f4e3d2c1b0a9f8e7d6c5b4a3928170f6e5d4c3b2a1f0"

# ===== 三角色分账（Wrapper 工作中等的场景：65/25/10）=====
roles:
  supplier:
    name: "Alice (Marker PDF Core 作者)"
    airaccount: "0xa11ceA11ceA11ceA11ceA11ceA11ceA11ceA11c"
    percent: 65                             # 区间 50-90，本案 Wrapper 做了较多工作所以 Supplier 让出 5%
    internal_split:                         # Supplier 内部：Alice 主导 + 上游一点
      - address: "0xa11ceA11ceA11ceA11ceA11ceA11ceA11ceA11c"
        share: 92
        role: "core author (Marker PDF)"
      - address: "0xUpstreamSuryaA1ceA1ceA1ceA1ceA1ceA1ceA1c"
        share: 8
        role: "upstream OSS (Surya OCR base model, signed PGL)"

  wrapper:
    name: "Team X (UX & Integration Studio)"
    airaccount: "0xTeamXTeamXTeamXTeamXTeamXTeamXTeamX0001"
    percent: 25                             # 区间 0-40，本案做的工作较多
    work_summary:
      - "Docker 化（含 Apple Silicon arm64 镜像）"
      - "Web GUI 适配（React + Tailwind）"
      - "多语种 UI（中英日韩 4 语种）"
      - "新增批量处理 + 拖拽上传功能"
      - "修复 5 个上游已知 bug"
      - "Mother Test 5 项全过"
    internal_split:
      - address: "0xDesigner000Designer000Designer000Designer"
        share: 25
        role: "UI/UX designer"
      - address: "0xEngineer000Engineer000Engineer000Engineer"
        share: 50
        role: "integration & backend engineer"
      - address: "0xTester000Tester000Tester000Tester0000000"
        share: 25
        role: "QA tester + i18n + docs"

  seller:
    name: "AgentStore for Public Goods"
    airaccount: "0xAgentStoreDA0AgentStoreDA0AgentStoreDA0001"
    percent: 10                             # 固定，不可调

  # 顶层加总：65 + 25 + 10 = 100 ✓
  # 硬约束：supplier (65) ≥ 50 ✓ ；wrapper (25) ≤ 40 ✓ ；seller (10) = 10 ✓

# ===== 接入方式：Docker =====
integration:
  type: "docker"
  docker:
    image: "ghcr.io/team-x/awesome-pdf-scanner:v1.2.0"
    expose_port: 7860
    healthcheck_path: "/health"
    api_path: "/api/v1"
    resources:
      cpu: "1.0"
      memory: "2Gi"
      gpu: "optional"

# ===== 分发与定价 =====
distribution:
  tiers:
    - tier: "free"
      enabled: true
      limits:
        max_pages_per_doc: 5
        max_docs_per_day: 3
      reputation_reward: true

    - tier: "paid"
      enabled: true
      price_pnts: 50                       # ≈ $0.50
      price_usd_equivalent: 0.50
      billing: "per-document"
      unlocks:
        max_pages_per_doc: "unlimited"
        max_docs_per_day: "unlimited"
        priority_queue: true

  end_user_friendly: true
  requires_user_setup: false

# ===== Local-first 数据路由 =====
data_routing:
  data_classes:
    - class: "personal_sensitive"
      route: "local_only"
      examples: ["医疗记录 PDF", "身份证扫描"]
    - class: "personal_general"
      route: "local_first"
      examples: ["个人笔记", "工作文档"]
    - class: "public"
      route: "any"
      examples: ["公开论文", "公开报告"]
  prohibited_uses:
    - "military"
    - "mass_surveillance"

# ===== 合规与隐私 =====
compliance:
  privacy_policy_url: "https://github.com/team-x/awesome-pdf-scanner/blob/main/PRIVACY.md"
  data_retention: "session"                  # 处理完即删除
  gdpr_compliant: true

# ===== 验证与扩展 =====
verification:
  github_repo: "team-x/awesome-pdf-scanner"
  proof_of_open_source: "https://github.com/team-x/awesome-pdf-scanner/blob/main/LICENSE"
  mother_test_passed: true                   # 通过妈妈测试
  mother_test_score: 5                       # 5/5 项
  audit_reports: []
  manifest_checksum: "sha256:e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
  splits_locked: true
