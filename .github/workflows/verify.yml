name: Verify

# Guards for three failure modes that all reached `main` (or nearly did) during PR #22/#34/#35,
# each one invisible until a human reviewer happened to catch it:
#
#   1. dist/ is hand-committed and deployed VERBATIM (deploy.yml uploads it with no build step),
#      so a content change whose dist/ wasn't regenerated ships a stale site — the fix looks
#      merged but never reaches users.
#   2. A task's YAML frontmatter with an unquoted ':' in the title makes the backlog parser emit a
#      blank record that still carries the raw markdown; that empty record shipped into the public
#      search index. One careless batch broke 10 files at once.
#   3. check-docs.sh is the fail-closed gate an unattended `pilot run` relies on. It silently
#      failed OPEN on a non-integer threshold — a gate that reports safety it never verified.
#
# Runs on PRs and pushes to main so a direct push can't bypass it either.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  task-yaml:
    name: Task frontmatter is valid YAML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - name: Parse every backlog/tasks/*.md frontmatter
        run: python3 scripts/ci/check-task-yaml.py

  docs-gate:
    name: check-docs.sh fails closed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert the gate rejects bad input and blank templates
        run: bash scripts/ci/check-docs-gate.sh

  dist-reproducible:
    name: dist/ matches a fresh build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the pinned backlog CLI
        # `npx backlog` must NOT be used: the bare name `backlog` is an unrelated package
        # ("Orchestrator for AI coding agents"); the CLI this repo exports with is `backlog.md`,
        # whose bin happens to also be named `backlog`. That works locally only because backlog.md
        # is installed globally — on a clean runner `npx backlog` fetches the wrong package from the
        # registry, its `--no-open` flag errors, spawn's stdio:'ignore' swallows it, and every fetch
        # then fails. Install the real package locally so the bin on PATH can only be that one.
        run: npm install --no-save backlog.md@1.49.3
      - name: Rebuild dist/ and diff against what is committed
        run: |
          set -euo pipefail
          export PATH="$PWD/node_modules/.bin:$PATH"   # the pinned bin wins over any registry lookup
          npm run build

          # `git diff` compares TRACKED files only, so a file the build CREATES is untracked and
          # completely invisible to it — the guard would pass while shipping a dangling reference.
          # That is not hypothetical: this very PR added a doc-8 entry to docs.json/search.json
          # without committing dist/api/docs/doc-8.json, and the original `git diff --quiet` check
          # reported clean. `-AN` (intent-to-add) registers new paths so the diff can see them.
          git add -AN -- dist/

          # version.json holds the backlog.md CLI version ({"version":"1.45.0"}) — NOT a timestamp.
          # It is excluded because a CLI upgrade would otherwise fail every PR until someone
          # rebuilt; treat a change here as "the pinned CLI moved", which the pin above controls.
          # Distinguish "the build failed" from "dist/ is genuinely stale" BEFORE advising anything.
          # The exporter clears dist/ up front, so a failed build leaves it empty — and the old
          # message told the developer to "run the build and commit the result", which on a machine
          # that also can't build would commit an EMPTY dist/. deploy.yml uploads dist/ verbatim, so
          # following that advice would wipe the live site. Never suggest committing output from a
          # build we did not verify succeeded.
          if [ ! -s dist/index.html ] || [ ! -s dist/api/tasks.json ]; then
            echo "::error::The export did not produce a usable dist/ — this is a BUILD FAILURE, not a stale dist/."
            echo "Do NOT commit dist/ from this run; it is empty or partial. Fix the build first."
            ls -la dist dist/api 2>/dev/null | head -30
            exit 1
          fi

          if ! git diff --quiet -- dist/ ':(exclude)dist/api/version.json'; then
            echo "::error::dist/ is stale — run 'pnpm run build' locally and commit the result."
            echo "Files that differ from a fresh build (new files included):"
            git diff --stat -- dist/ ':(exclude)dist/api/version.json'
            echo "--- diff (first 200 lines) ---"
            git diff -- dist/ ':(exclude)dist/api/version.json' | head -200
            exit 1
          fi
          echo "dist/ is reproducible from the committed sources."
